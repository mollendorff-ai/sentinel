# Forge's AI-pipeline demonstration (ADR-012; Forge docs/WORKFLOWS.md, workflow 4).
#
# Started by hand from the Actions tab. Runs Sentinel once, unattended, on a saved
# input, and opens a pull request with the run's model, Forge results and brief
# for a person to review. Needs the ANTHROPIC_API_KEY repository secret, and
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests" turned on.
name: Demo

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker with a saved input in inputs/"
        required: true
        default: "AAPL"
      period:
        description: "Period folder in inputs/<TICKER>/ (empty: the newest)"
        required: false
        default: ""
      quick:
        description: "Skip risk and scenarios"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  run:
    name: Run Sentinel and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TICKER: ${{ inputs.ticker }}
      PERIOD: ${{ inputs.period }}
      QUICK: ${{ inputs.quick }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Install the pinned Forge (checksum recorded in the script)
        run: |
          scripts/install-forge.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refuse an input whose expected.yaml nobody has checked
        run: |
          python - <<'EOF'
          import os, sys
          from sentinel.inputs import load_input
          saved = load_input(os.environ["TICKER"], os.environ["PERIOD"] or None)
          if not saved.expected.checked:
              sys.exit(f"{saved.path}/expected.yaml is not checked by a person (checked: false)")
          print(f"Input {saved.path}: expected.yaml checked by a person")
          EOF

      - name: Run Sentinel, no person in the loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTINEL_LLM_PROVIDER: anthropic
          SENTINEL_LLM_MODEL: ${{ vars.SENTINEL_LLM_MODEL || 'claude-sonnet-5-5' }}
        run: |
          set -- "$TICKER"
          [ -n "$PERIOD" ] && set -- --period "$PERIOD" "$@"
          [ "$QUICK" = "true" ] && set -- --quick "$@"
          python -m sentinel "$@"

      - name: Keep the run folder, even if the run failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-run
          path: runs/
          if-no-files-found: ignore

      - name: Commit the run and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_dir="$(ls -d runs/"$TICKER"/*/ | sort | tail -1)"
          run_dir="${run_dir%/}"
          stamp="$(basename "$run_dir")"
          branch="demo/$TICKER-$stamp"
          python -m sentinel.summary "$run_dir" > summary.md
          {
            echo
            echo "---"
            echo "Opened by the [Demo workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) with no person in the loop. Review the figures, formulas and results in the diff, then merge to keep the run in git."
          } >> summary.md
          git switch -c "$branch"
          git add "$run_dir"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Demo run: $TICKER $stamp"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Demo run: $TICKER $stamp" --body-file summary.md
